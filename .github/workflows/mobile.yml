name: mobile

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ['mobile/**', 'contracts/test/fixtures/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'contracts/test/fixtures/**', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The client and the contract must agree byte-for-byte about the same
      # WebAuthn vector. Each side being self-consistently wrong is the failure
      # mode that would otherwise only surface on a real device against a real
      # chain, so the shared fixture is checked rather than trusted.
      - name: WebAuthn fixture matches the contracts copy
        working-directory: .
        run: |
          diff -u contracts/test/fixtures/webauthn_vector.json \
                  mobile/test/fixtures/webauthn_vector.json \
            || { echo "::error::mobile and contracts WebAuthn fixtures diverged"; exit 1; }

      - name: Resolve dependencies
        run: flutter pub get

      # Format in place then diff, so a failure shows exactly what to change
      # rather than only naming the file. Formatter output differs slightly
      # between Dart releases, and "run it and look" beats guessing.
      - name: Verify formatting
        run: |
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo "::error::dart format changed files. Run 'make dart-fmt' and commit."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
