name: security

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the binary rather than gitleaks-action: the action derives a commit
      # range from the push event, which is unresolvable on a first push
      # (<first-commit>^ does not exist) and after a force-push. Scanning full
      # history is deterministic on every event.
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # This project handles a treasury. A committed private key is not a style
      # issue, it is a loss of funds, so the check is blocking.
      - name: Scan full history
        run: gitleaks detect --source . --redact --no-banner -v

      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --no-banner -v

  key-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt and braces for the shape gitleaks' default rules miss: a bare
      # 32-byte hex private key sitting in source or config.
      - name: Reject raw private key material
        run: |
          if grep -rInE '(^|[^0-9a-fA-Fx])0x[0-9a-fA-F]{64}([^0-9a-fA-F]|$)' \
              --include='*.go' --include='*.dart' --include='*.sol' \
              --include='*.yaml' --include='*.yml' --include='*.env*' . ; then
            echo "::error::a 64-hex-char literal looks like a private key. Move it to a secret."
            exit 1
          fi
          echo "no raw key material found"
