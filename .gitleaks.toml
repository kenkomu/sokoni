# gitleaks configuration.
#
# Extends the default ruleset — everything upstream detects still fails the
# build. This file only carves out two things.

[extend]
useDefault = true

[allowlist]
description = "Vendored dependencies are not ours to audit"
paths = [
  # Foundry submodules: forge-std, solady, account-abstraction, OpenZeppelin.
  # Their own test fixtures trip the generic rules, and CI's security job does
  # not check out submodules anyway — excluding them keeps a local scan
  # meaningful and identical to CI's.
  '''contracts/lib/''',
]

[[rules]]
# Redefining the noisy rule with a path allowlist is the durable fix. The
# alternative, per-finding fingerprints in .gitleaksignore, embeds a commit
# hash and so goes stale every time the file is regenerated.
id = "generic-api-key"

  [rules.allowlist]
  description = """
  WebAuthn test vectors. These files are high-entropy by nature — P-256 public
  key coordinates, signature scalars, DER blobs and CBOR keys — and every value
  is generated by contracts/script/gen_webauthn_vector.py from a hardcoded
  test-only key. Nothing here has ever held value, and the generator no longer
  emits the private key at all.
  """
  paths = [
    '''contracts/test/fixtures/.*\.json''',
    '''mobile/test/fixtures/.*\.json''',
  ]
