[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Monad raises the contract size limit to 128 KB (from Ethereum's 24 KB).
# We stay well under, but the ceiling is worth knowing.
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
monad = "${MONAD_RPC_HTTP}"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
